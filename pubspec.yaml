name: astrbot_mobile_manager
description: An independent mobile client for AstrBot over SSH.
publish_to: none
version: 0.1.0+1
license: AGPL-3.0-or-later

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.2.0
  file_selector: ^1.1.0
  flutter_secure_storage: ^11.2.0
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
