name: iOS unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Check Xcode and fetch iOS build dependencies
        run: |
          xcodebuild -version
          flutter precache --ios
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Test with the loopback SSH fixture
        env:
          ASTRBOT_SSH_TEST: '1'
        run: |
          python -m pip install paramiko==5.1.0
          flutter test --no-pub
      - name: Compile iOS Release App without signing
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package unsigned IPA
        run: python tool/package_ipa.py build/ios/iphoneos/Runner.app build/astrbot-mobile-unsigned.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astrbot-mobile-ios-unsigned-ipa
          path: build/astrbot-mobile-unsigned.ipa
          if-no-files-found: error
